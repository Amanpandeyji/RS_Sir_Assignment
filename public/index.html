<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinels of Truth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Multi-Agent Verification</p>
      <h1>Sentinels of Truth</h1>
      <p class="lead">Write to check</p>
      <div class="form">
        <input id="claimInput" type="text" placeholder="India landed humans on Mars in 2026">
        <button id="verifyButton">Verify Claim</button>
      </div>
      <div class="actions">
        <button id="resetButton" class="secondary">Reset Database</button>
        <button id="downloadButton" class="secondary">Download Database</button>
      </div>
      <pre id="result">Waiting for a claim.</pre>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
